services:
  postgres:
    container_name: postgres
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    command: |
      postgres 
      -c wal_level=logical
      -c max_wal_senders=10 
      -c max_replication_slots=5 
      -c hot_standby=on 
      -c hot_standby_feedback=on
    volumes:
      - postgres_data_dev_db:/var/lib/postgresql/data
    restart: always
    networks:
      - postgres

volumes:
  dev-db_postgres_data_dev_db:
    external: true

networks:
  postgres:
    external: true
